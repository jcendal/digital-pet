AWSTemplateFormatVersion: "2010-09-09"
Description: One-time GitHub OIDC access for Digital Pet production deployments

Parameters:
  WebBucketName:
    Type: String
  WebDistributionId:
    Type: String
  WebDeployRoleName:
    Type: String
  WebOriginAccessControlId:
    Type: String
    AllowedPattern: '[A-Z0-9]+'
  WebCertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-zA-Z0-9-]+'
  WebHostedZoneId:
    Type: String
    AllowedPattern: 'Z[A-Z0-9]+'
  GoogleSecretName:
    Type: String
    Default: digital-pet/production/google-oauth

Resources:
  BackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: digital-pet-backend-github-production
      Description: GitHub Actions deployment access for digital-pet web-production
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:jcendal@29627990/digital-pet@1363502452:environment:web-production
      Policies:
        - PolicyName: deploy-production
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CDK's existing execution role controls provisioning permissions.
              # Its default AdministratorAccess makes this a privileged CI role.
              - Sid: AssumeCdkDeploymentRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-deploy-role-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-file-publishing-role-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-lookup-role-${AWS::AccountId}-${AWS::Region}
              - Sid: ReadDeploymentStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/DigitalPetBackend-production/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/CDKToolkit/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/digital-pet-web/*
              - Sid: HostingChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/digital-pet-web/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/digital-pet-*/*
              - Sid: ValidateTemplatesAndCapacity
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                  - lambda:GetAccountSettings
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: ReadBootstrapVersion
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/hnb659fds/version
              - Sid: InspectGoogleSecretMetadata
                Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GoogleSecretName}-??????
              - Sid: ReadAndInvalidateWebsite
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistributionId}
              - Sid: UpdateWebsiteThroughCloudFormation
                Effect: Allow
                Action: cloudfront:UpdateDistribution
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistributionId}
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
              # CloudFormation resolves existing attributes while planning/updating the distribution.
              - Sid: InspectHostingOriginAccessControl
                Effect: Allow
                Action: cloudfront:GetOriginAccessControl
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/${WebOriginAccessControlId}
              - Sid: InspectHostingFunction
                Effect: Allow
                Action:
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/digital-pet-web-routes
              - Sid: InspectHostingCloudFrontTags
                Effect: Allow
                Action: cloudfront:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/digital-pet-web-routes
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistributionId}
              - Sid: InspectHostingCertificate
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                Resource: !Ref WebCertificateArn
              - Sid: InspectHostingDns
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${WebHostedZoneId}
              - Sid: RefreshHostingAliasesThroughCloudFormation
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${WebHostedZoneId}
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: [digital-pet.rebase.es]
                    route53:ChangeResourceRecordSetsRecordTypes: [A, AAAA]
                    route53:ChangeResourceRecordSetsActions: [UPSERT]
              - Sid: WaitForHostingDns
                Effect: Allow
                Action: route53:GetChange
                Resource: !Sub arn:${AWS::Partition}:route53:::change/*
              - Sid: InspectExistingWebRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${WebDeployRoleName}
              - Sid: UpdateWebOutputAccessThroughCloudFormation
                Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${WebDeployRoleName}
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: InspectWebsiteBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  # Required by the CloudFormation bucket read handler when resolving attributes.
                  - s3:GetAccelerateConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetAnalyticsConfiguration
                  - s3:GetBucketCORS
                  - s3:GetEncryptionConfiguration
                  - s3:GetInventoryConfiguration
                  - s3:GetBucketLogging
                  - s3:GetMetricsConfiguration
                  - s3:GetBucketNotification
                  - s3:GetBucketVersioning
                  - s3:GetReplicationConfiguration
                  - s3:GetBucketWebsite
                  - s3:GetBucketObjectLockConfiguration
                  - s3:GetBucketTagging
                  - s3:ListTagsForResource
                  - s3:GetBucketAbac
                  - s3:GetBucketOwnershipControls
                  - s3:GetIntelligentTieringConfiguration
                  - s3:GetBucketMetadataTableConfiguration
                  - s3:GetBucketDefaultStorageClass
                Resource: !Sub arn:${AWS::Partition}:s3:::${WebBucketName}
              - Sid: PublishWebsiteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:${AWS::Partition}:s3:::${WebBucketName}/*
      Tags:
        - Key: Application
          Value: digital-pet
        - Key: Environment
          Value: production

Outputs:
  BackendDeployRoleArn:
    Value: !GetAtt BackendDeployRole.Arn
