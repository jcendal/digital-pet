AWSTemplateFormatVersion: "2010-09-09"
Description: One-time GitHub OIDC access for Digital Pet production deployments

Parameters:
  WebBucketName:
    Type: String
  WebDistributionId:
    Type: String
  WebDeployRoleName:
    Type: String
  GoogleSecretName:
    Type: String
    Default: digital-pet/production/google-oauth

Resources:
  BackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: digital-pet-backend-github-production
      Description: GitHub Actions deployment access for digital-pet web-production
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:jcendal@29627990/digital-pet@1363502452:environment:web-production
      Policies:
        - PolicyName: deploy-production
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CDK's existing execution role controls provisioning permissions.
              # Its default AdministratorAccess makes this a privileged CI role.
              - Sid: AssumeCdkDeploymentRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-deploy-role-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-file-publishing-role-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-lookup-role-${AWS::AccountId}-${AWS::Region}
              - Sid: ReadDeploymentStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/DigitalPetBackend-production/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/CDKToolkit/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/digital-pet-web/*
              - Sid: HostingChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/digital-pet-web/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/digital-pet-*/*
              - Sid: ValidateTemplatesAndCapacity
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                  - lambda:GetAccountSettings
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: ReadBootstrapVersion
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/hnb659fds/version
              - Sid: InspectGoogleSecretMetadata
                Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GoogleSecretName}-??????
              - Sid: ReadAndInvalidateWebsite
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistributionId}
              - Sid: UpdateWebsiteThroughCloudFormation
                Effect: Allow
                Action: cloudfront:UpdateDistribution
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistributionId}
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: InspectExistingWebRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${WebDeployRoleName}
              - Sid: UpdateWebOutputAccessThroughCloudFormation
                Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${WebDeployRoleName}
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: InspectWebsiteBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${WebBucketName}
              - Sid: PublishWebsiteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:${AWS::Partition}:s3:::${WebBucketName}/*
      Tags:
        - Key: Application
          Value: digital-pet
        - Key: Environment
          Value: production

Outputs:
  BackendDeployRoleArn:
    Value: !GetAtt BackendDeployRole.Arn
