name: Deploy Digital Pet backend

on:
  workflow_dispatch:
    inputs:
      action:
        description: Check configuration, review a plan, or deploy backend and web
        type: choice
        required: true
        default: plan
        options: [preflight, plan, deploy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: digital-pet-web-production
  cancel-in-progress: false
  queue: max

jobs:
  backend:
    if: github.repository == 'jcendal/digital-pet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: web-production
    env:
      DEPLOY_ENV: production
      DEPLOY_ACTION: ${{ inputs.action }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_SECRET_ARN: ${{ vars.GOOGLE_SECRET_ARN }}
      WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
      WEB_STACK_NAME: ${{ vars.WEB_STACK_NAME }}
      WEB_STACK_REGION: ${{ vars.WEB_STACK_REGION }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      WEB_BUCKET_NAME: ${{ vars.WEB_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: npm ci
      - name: Validate source
        run: npm run validate
      - name: Install browser for deployment checks
        if: inputs.action == 'deploy'
        run: npx playwright install --with-deps chromium
      - name: Verify game and online flows before deployment
        if: inputs.action == 'deploy'
        run: npm run test:browser --workspace @jcendal/web-digital-pet
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.BACKEND_DEPLOY_ROLE_ARN }}
      - name: Check publication bucket
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          : "${WEB_BUCKET_NAME:?Set WEB_BUCKET_NAME in this GitHub environment}"
          : "${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID in this GitHub environment}"
          aws s3api head-bucket --bucket "$WEB_BUCKET_NAME" --expected-bucket-owner "$AWS_ACCOUNT_ID"
      - name: Run selected infrastructure action
        run: npm run backend -- "$DEPLOY_ACTION" --environment "$DEPLOY_ENV"
      - name: Prepare CDN routing
        if: inputs.action == 'deploy'
        run: npm run backend -- cdn-plan --environment "$DEPLOY_ENV"
      - name: Export validated backend outputs
        if: inputs.action == 'deploy'
        run: node --experimental-strip-types packages/web-digital-pet-backend/scripts/export-web-env.ts ".backend-deploy/$DEPLOY_ENV/outputs.json"
      - name: Build connected website
        if: inputs.action == 'deploy'
        run: npm run build:static --workspace @jcendal/web-digital-pet
      - name: Apply CDN routing
        if: inputs.action == 'deploy'
        run: npm run backend -- cdn-apply --environment "$DEPLOY_ENV"
      - name: Publish website
        if: inputs.action == 'deploy'
        run: bash scripts/publish-web.sh
