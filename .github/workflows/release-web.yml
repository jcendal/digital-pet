name: Release Digital Pet web

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a new release (ignored when retry_tag is set)
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      retry_tag:
        description: Existing web release tag to deploy again (for example web-digital-pet-v0.1.0)
        required: false
        type: string
      release_note:
        description: Merged pull request title to use when Unreleased has no notes
        required: false
        type: string

concurrency:
  group: digital-pet-web-production
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Version Digital Pet web
    if: github.repository == 'jcendal/digital-pet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.result.outputs.release_tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate new release or retry
        id: mode
        env:
          DISPATCH_REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ -n "$RETRY_TAG" ]]; then
            [[ "$RETRY_TAG" =~ ^web-digital-pet-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git show-ref --verify --quiet "refs/tags/$RETRY_TAG"
            git merge-base --is-ancestor "$RETRY_TAG^{commit}" refs/remotes/origin/main
            git checkout --detach "$RETRY_TAG"
            release_version="${RETRY_TAG#web-digital-pet-v}"
            test "$(node -p 'require("./packages/web-digital-pet/package.json").version')" = "$release_version"
            printf 'retry=true\nrelease_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          else
            [[ "$BUMP" =~ ^(patch|minor|major)$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
            printf 'retry=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.mode.outputs.retry != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Set up Bun
        if: steps.mode.outputs.retry != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        if: steps.mode.outputs.retry != 'true'
        run: npm ci

      - name: Verify local Digital Pet packages
        if: steps.mode.outputs.retry != 'true'
        run: node scripts/check-workspace-dependencies.mjs

      - name: Prepare release metadata
        if: steps.mode.outputs.retry != 'true'
        id: metadata
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_NOTE: ${{ inputs.release_note }}
        run: |
          set -euo pipefail
          release_date="$(date -u +%F)"
          git tag --list | node --experimental-strip-types scripts/release-metadata.ts \
            --package-json packages/web-digital-pet/package.json \
            --changelog packages/web-digital-pet/CHANGELOG.md \
            --tag-prefix web-digital-pet-v \
            --bump "$BUMP" \
            --date "$release_date" \
            --release-note "$RELEASE_NOTE"

      - name: Update lockfile
        if: steps.mode.outputs.retry != 'true'
        run: |
          node scripts/check-workspace-dependencies.mjs --sync @jcendal/web-digital-pet
          npm install --package-lock-only --ignore-scripts

      - name: Run release checks
        if: steps.mode.outputs.retry != 'true'
        run: |
          npm run check --workspace @jcendal/web-digital-pet
          npm run test --workspace @jcendal/web-digital-pet

      - name: Set up Git
        if: steps.mode.outputs.retry != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag release
        if: steps.mode.outputs.retry != 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          git add 'packages/*/package.json' packages/web-digital-pet/CHANGELOG.md package-lock.json
          git commit -m "chore(web release): v$RELEASE_VERSION"
          git tag -a "web-digital-pet-v$RELEASE_VERSION" -m "Web Digital Pet v$RELEASE_VERSION"

      - name: Commit next version
        if: steps.mode.outputs.retry != 'true'
        env:
          NEXT_DEV_VERSION: ${{ steps.metadata.outputs.next_dev_version }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-metadata.ts set-package-version packages/web-digital-pet/package.json "$NEXT_DEV_VERSION"
          node scripts/check-workspace-dependencies.mjs --sync @jcendal/web-digital-pet
          npm install --package-lock-only --ignore-scripts
          git add 'packages/*/package.json' package-lock.json
          git commit -m "chore(web): bump v$NEXT_DEV_VERSION"

      - name: Push release
        if: steps.mode.outputs.retry != 'true'
        run: node --experimental-strip-types scripts/push-release.ts "web-digital-pet-v${{ steps.metadata.outputs.release_version }}"

      - name: Export release coordinates
        id: result
        env:
          RETRY: ${{ steps.mode.outputs.retry }}
          RETRY_VERSION: ${{ steps.mode.outputs.release_version }}
          NEW_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          if [ "$RETRY" = true ]; then
            version="$RETRY_VERSION"
          else
            version="$NEW_VERSION"
          fi
          test -n "$version"
          printf 'release_tag=web-digital-pet-v%s\n' "$version" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Digital Pet web and backend
    needs: version
    if: github.repository == 'jcendal/digital-pet' && github.ref == 'refs/heads/main' && needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: web-production
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: production
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_SECRET_ARN: ${{ vars.GOOGLE_SECRET_ARN }}
      WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
      WEB_STACK_NAME: ${{ vars.WEB_STACK_NAME }}
      WEB_STACK_REGION: ${{ vars.WEB_STACK_REGION }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      WEB_BUCKET_NAME: ${{ vars.WEB_BUCKET_NAME }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.release_tag }}
      - name: Require a release with the unified deployment tooling
        run: |
          test -f packages/web-digital-pet-backend/scripts/deploy.ts
          test -f packages/web-digital-pet-backend/scripts/export-web-env.ts
          test -f scripts/publish-web.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: npm ci
      - name: Restore task cache
        uses: ./.github/actions/turbo-cache
      - name: Validate web, backend and their dependencies
        run: npm run validate:web
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.BACKEND_DEPLOY_ROLE_ARN }}
      - name: Check publication bucket
        run: |
          set -euo pipefail
          : "${WEB_BUCKET_NAME:?Set WEB_BUCKET_NAME in this GitHub environment}"
          : "${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID in this GitHub environment}"
          aws s3api head-bucket --bucket "$WEB_BUCKET_NAME" --expected-bucket-owner "$AWS_ACCOUNT_ID"
      - name: Deploy backend from the release tag
        run: npm run backend -- deploy --environment "$DEPLOY_ENV"
      - name: Prepare CDN routing
        run: npm run backend -- cdn-plan --environment "$DEPLOY_ENV"
      - name: Export validated backend outputs
        run: node --experimental-strip-types packages/web-digital-pet-backend/scripts/export-web-env.ts ".backend-deploy/$DEPLOY_ENV/outputs.json"
      - name: Build connected website
        run: npm run build:static --workspace @jcendal/web-digital-pet
      - name: Apply CDN routing
        run: npm run backend -- cdn-apply --environment "$DEPLOY_ENV"
      - name: Publish website
        run: bash scripts/publish-web.sh
