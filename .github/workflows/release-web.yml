name: Release Digital Pet web

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a new release (ignored when retry_tag is set)
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      retry_tag:
        description: Existing web release tag to deploy again (for example web-digital-pet-v0.1.0)
        required: false
        type: string
      release_note:
        description: Merged pull request title to use when Unreleased has no notes
        required: false
        type: string

concurrency:
  group: digital-pet-web-production
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Version Digital Pet web
    if: github.repository == 'jcendal/digital-pet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.result.outputs.release_tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate new release or retry
        id: mode
        env:
          DISPATCH_REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ -n "$RETRY_TAG" ]]; then
            [[ "$RETRY_TAG" =~ ^web-digital-pet-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git show-ref --verify --quiet "refs/tags/$RETRY_TAG"
            git merge-base --is-ancestor "$RETRY_TAG^{commit}" refs/remotes/origin/main
            git checkout --detach "$RETRY_TAG"
            release_version="${RETRY_TAG#web-digital-pet-v}"
            test "$(node -p 'require("./packages/web-digital-pet/package.json").version')" = "$release_version"
            printf 'retry=true\nrelease_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          else
            [[ "$BUMP" =~ ^(patch|minor|major)$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
            printf 'retry=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.mode.outputs.retry != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Set up Bun
        if: steps.mode.outputs.retry != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        if: steps.mode.outputs.retry != 'true'
        run: npm ci

      - name: Verify local Digital Pet packages
        if: steps.mode.outputs.retry != 'true'
        run: node scripts/check-workspace-dependencies.mjs

      - name: Prepare release metadata
        if: steps.mode.outputs.retry != 'true'
        id: metadata
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_NOTE: ${{ inputs.release_note }}
        run: |
          set -euo pipefail
          release_date="$(date -u +%F)"
          git tag --list | node --experimental-strip-types scripts/release-metadata.ts \
            --package-json packages/web-digital-pet/package.json \
            --changelog packages/web-digital-pet/CHANGELOG.md \
            --tag-prefix web-digital-pet-v \
            --bump "$BUMP" \
            --date "$release_date" \
            --release-note "$RELEASE_NOTE"

      - name: Update lockfile
        if: steps.mode.outputs.retry != 'true'
        run: npm install --package-lock-only --ignore-scripts

      - name: Run release checks
        if: steps.mode.outputs.retry != 'true'
        run: |
          npm run check --workspace @jcendal/web-digital-pet
          npm run test --workspace @jcendal/web-digital-pet

      - name: Set up Git
        if: steps.mode.outputs.retry != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag release
        if: steps.mode.outputs.retry != 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          git add packages/web-digital-pet/package.json packages/web-digital-pet/CHANGELOG.md package-lock.json
          git commit -m "chore(web release): v$RELEASE_VERSION"
          git tag -a "web-digital-pet-v$RELEASE_VERSION" -m "Web Digital Pet v$RELEASE_VERSION"

      - name: Commit next version
        if: steps.mode.outputs.retry != 'true'
        env:
          NEXT_DEV_VERSION: ${{ steps.metadata.outputs.next_dev_version }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-metadata.ts set-package-version packages/web-digital-pet/package.json "$NEXT_DEV_VERSION"
          npm install --package-lock-only --ignore-scripts
          git add packages/web-digital-pet/package.json package-lock.json
          git commit -m "chore(web): bump v$NEXT_DEV_VERSION"

      - name: Push release
        if: steps.mode.outputs.retry != 'true'
        run: node --experimental-strip-types scripts/push-release.ts "web-digital-pet-v${{ steps.metadata.outputs.release_version }}"

      - name: Export release coordinates
        id: result
        env:
          RETRY: ${{ steps.mode.outputs.retry }}
          RETRY_VERSION: ${{ steps.mode.outputs.release_version }}
          NEW_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          if [ "$RETRY" = true ]; then
            version="$RETRY_VERSION"
          else
            version="$NEW_VERSION"
          fi
          test -n "$version"
          printf 'release_tag=web-digital-pet-v%s\n' "$version" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Digital Pet web
    needs: version
    if: github.repository == 'jcendal/digital-pet' && needs.version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      WEB_BUCKET_NAME: ${{ vars.WEB_BUCKET_NAME }}
      WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.release_tag }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build:static --workspace @jcendal/web-digital-pet

      - name: Validate deployment settings
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "Missing AWS_ROLE_ARN repository variable" >&2; exit 1; }
          test -n "$WEB_BUCKET_NAME" || { echo "Missing WEB_BUCKET_NAME repository variable" >&2; exit 1; }
          test -n "$WEB_DISTRIBUTION_ID" || { echo "Missing WEB_DISTRIBUTION_ID repository variable" >&2; exit 1; }

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Publish website
        run: |
          site=packages/web-digital-pet/dist-static
          # Retried historical tags may still export the previous revisions layout.
          for immutable_dir in assets revisions; do
            if [ -d "$site/$immutable_dir" ]; then
              aws s3 sync "$site/$immutable_dir" "s3://$WEB_BUCKET_NAME/$immutable_dir" \
                --cache-control "public,max-age=31536000,immutable"
            fi
          done
          aws s3 sync "$site" "s3://$WEB_BUCKET_NAME/" \
            --exclude "assets/*" --exclude "revisions/*" --exclude "index.html" \
            --exclude "service-worker.js" --exclude "manifest.webmanifest" \
            --exclude "api/browser.json" \
            --cache-control "no-cache"
          aws s3 cp "$site/api/browser.json" "s3://$WEB_BUCKET_NAME/api/browser.json" \
            --content-type "application/json" --cache-control "no-cache"
          aws s3 cp "$site/manifest.webmanifest" \
            "s3://$WEB_BUCKET_NAME/manifest.webmanifest" \
            --content-type "application/manifest+json" \
            --cache-control "no-cache"
          aws s3 cp "$site/index.html" "s3://$WEB_BUCKET_NAME/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp "$site/service-worker.js" \
            "s3://$WEB_BUCKET_NAME/service-worker.js" \
            --content-type "text/javascript" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "$WEB_DISTRIBUTION_ID" \
            --paths "/" "/index.html" "/dex*" "/history*" "/view/*" \
              "/service-worker.js" "/manifest.webmanifest" "/api/*" \
              "/fonts/*" "/images/*" "/icons/*" "/regions/*" "/favicon.ico"
