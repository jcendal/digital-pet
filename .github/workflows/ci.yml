name: Validate monorepo

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, test and package
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: npm ci

      - name: Restore task cache
        uses: ./.github/actions/turbo-cache

      - name: Select affected packages
        id: affected
        run: |
          npx turbo run check test test:persistence build --affected --dry=json > "$RUNNER_TEMP/turbo-affected.json"
          node scripts/ci-affected.mjs "$RUNNER_TEMP/turbo-affected.json"

      - name: Check shared configuration and CI selection
        run: npm run check:workspace && npm run test:ci

      - name: Test changed asset importers
        if: steps.affected.outputs.importers == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/importer-tests"
          "$RUNNER_TEMP/importer-tests/bin/python" -m pip install -r scripts/requirements-tests.txt
          export PATH="$RUNNER_TEMP/importer-tests/bin:$PATH"
          npm run test:assets

      - name: Check affected packages
        run: npx turbo run check --affected --concurrency=2

      - name: Test affected packages
        run: npx turbo run test test:persistence --affected --concurrency=2

      - name: Build affected apps
        run: npx turbo run build --affected --concurrency=2

      - name: Inspect npm package
        if: steps.affected.outputs.opencode == 'true'
        run: npm pack --workspace @jcendal/opencode-digital-pet --dry-run --json

      - name: Package Cursor VSIX
        if: steps.affected.outputs.cursor == 'true'
        working-directory: packages/cursor-digital-pet
        run: npm run package
