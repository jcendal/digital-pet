name: Validate monorepo

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, test and package
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: npm ci

      - name: Restore task cache
        uses: ./.github/actions/turbo-cache

      - name: Select affected packages
        id: affected
        run: |
          npx turbo run check test test:persistence build --affected --dry=json > "$RUNNER_TEMP/turbo-affected.json"
          node scripts/ci-affected.mjs "$RUNNER_TEMP/turbo-affected.json"

      - name: Check shared configuration and CI selection
        run: npm run check:workspace && npm run test:ci

      - name: Check affected packages
        run: npx turbo run check --affected --concurrency=2

      - name: Test affected packages
        run: npx turbo run test test:persistence --affected --concurrency=2

      - name: Build affected apps
        run: npx turbo run build --affected --concurrency=2

      - name: Install browser for web checks
        if: steps.affected.outputs.web == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify web assets, offline mode and worker updates
        id: browser-checks
        if: steps.affected.outputs.web == 'true'
        run: npm run test:browser

      - name: Save browser failure diagnostics
        if: failure() && steps.browser-checks.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: packages/web-digital-pet/test-results/
          retention-days: 7

      - name: Inspect npm package
        if: steps.affected.outputs.opencode == 'true'
        run: npm pack --workspace @jcendal/opencode-digital-pet --dry-run --json

      - name: Package Cursor VSIX
        if: steps.affected.outputs.cursor == 'true'
        working-directory: packages/cursor-digital-pet
        run: npm run package
